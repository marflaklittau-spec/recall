<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="recall · 记忆环 — 转动环上的照片，点亮每一段回忆。">
<meta name="theme-color" content="#B9D3CC">
<title>recall · 记忆环</title>
<style>
  :root {
    --deep: #a6c2ba;
    --panel: #0d1830;
    --line: #22304d;
    --line-soft: rgba(140, 170, 220, .16);
    --text: #e8f0fc;
    --muted: #8fa3c4;
    --accent: #5ea0ff;
    --grad: linear-gradient(135deg, #3b7bff, #1e56e8);
    --ease: cubic-bezier(.22, .8, .26, 1);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Cascadia Code", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { font-family: var(--sans); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow: hidden; background: radial-gradient(1200px 700px at 50% -10%, #d8e5df 0%, #b9d3cc 50%, var(--deep) 100%); }
  ::selection { background: rgba(94, 160, 255, .35); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a3c63; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a5080; }
  button { font-family: var(--sans); }
  :focus-visible { outline: 2px solid rgba(94, 160, 255, .55); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }

  /* ===== 星空 ===== */
  .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 12% 22%, rgba(111, 145, 138, .4) 50%, transparent 51%),
      radial-gradient(1px 1px at 34% 68%, rgba(111, 145, 138, .28) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 58% 14%, rgba(95, 130, 122, .38) 50%, transparent 51%),
      radial-gradient(1px 1px at 72% 46%, rgba(111, 145, 138, .3) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 86% 76%, rgba(95, 130, 122, .34) 50%, transparent 51%),
      radial-gradient(1px 1px at 22% 86%, rgba(111, 145, 138, .26) 50%, transparent 51%),
      radial-gradient(1px 1px at 48% 38%, rgba(111, 145, 138, .24) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 92% 26%, rgba(95, 130, 122, .32) 50%, transparent 51%);
    animation: twinkle 5s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .45; } to { opacity: .9; } }
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes popin { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes toastin { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes itemin { from { opacity: 0; } to { opacity: 1; } }
  @keyframes lbin { from { opacity: 0; } to { opacity: 1; } }
  @keyframes imgin { from { opacity: 0; transform: scale(.95) translateY(10px); } to { opacity: 1; transform: none; } }

  /* ===== 顶栏 ===== */
  .topbar { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 16px); padding: 8px 10px 8px 14px; border-radius: 16px; background: rgba(10, 20, 40, .55); border: 1px solid var(--line-soft); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); box-shadow: 0 18px 50px rgba(0, 0, 0, .45); flex-wrap: wrap; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; color: var(--text); letter-spacing: .01em; }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #3b7bff, #06b6d4); display: grid; place-items: center; font-size: 14px; color: #fff; box-shadow: 0 4px 14px rgba(37, 99, 235, .4), inset 0 1px 0 rgba(255, 255, 255, .35); }
  .srcs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(7, 15, 29, .6); border: 1px solid var(--line-soft); }
  .src-chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 9px; border: none; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .22s var(--ease); white-space: nowrap; }
  .src-chip:hover { color: var(--text); }
  .src-chip.on { background: var(--grad); color: #fff; box-shadow: 0 4px 14px rgba(37, 99, 235, .4); }
  .src-chip .cnt { font-family: var(--mono); font-size: 11px; font-weight: 700; background: rgba(255, 255, 255, .16); border-radius: 999px; padding: 1px 7px; }
  .src-chip:not(.on) .cnt { background: rgba(140, 170, 220, .18); }
  .nav-auth { display: flex; align-items: center; gap: 8px; }
  .user-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #bfd4ff; background: rgba(94, 160, 255, .14); border: 1px solid rgba(94, 160, 255, .35); border-radius: 999px; padding: 6px 14px; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 600; border: 1px solid var(--line); background: rgba(16, 28, 52, .7); color: var(--text); cursor: pointer; white-space: nowrap; transition: all .2s var(--ease); }
  .btn:hover { border-color: #3a558a; background: #142348; transform: translateY(-1px); }
  .btn:active { transform: translateY(0) scale(.97); }
  .btn-primary { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 6px 18px rgba(37, 99, 235, .45); }
  .btn-primary:hover { filter: brightness(1.08); background: var(--grad); box-shadow: 0 10px 26px rgba(37, 99, 235, .55); }
  .btn-icon { padding: 8px 11px; }

  .bak-wrap { position: relative; }
  .menu { position: absolute; top: calc(100% + 10px); right: 0; min-width: 172px; background: #0e1a33; border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 24px 60px rgba(0, 0, 0, .55); animation: popin .18s var(--ease); z-index: 10; }
  .menu button { display: flex; width: 100%; align-items: center; gap: 9px; padding: 9px 12px; border: none; background: transparent; color: var(--text); font-size: 13.5px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: background .18s; }
  .menu button:hover { background: rgba(94, 160, 255, .14); }

  /* ===== 记忆环舞台 ===== */
  main { position: relative; height: 100dvh; min-height: 520px; }
  .ring-stage { position: absolute; inset: 0; overflow: hidden; perspective: 760px; perspective-origin: 50% 42%; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
  .ring-stage:active { cursor: grabbing; }
  .ring-stage::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 38% at 50% 46%, rgba(255, 255, 255, .5), transparent 70%); pointer-events: none; }
  .ring-floor { position: absolute; left: 50%; top: 74%; width: 62%; height: 16%; transform: translate(-50%, -50%) rotateX(74deg); border-radius: 50%; border: 1px solid rgba(111, 145, 138, .5); box-shadow: 0 0 44px rgba(111, 145, 138, .28), inset 0 0 60px rgba(111, 145, 138, .16); pointer-events: none; }
  .ring { position: absolute; inset: 0; transform-style: preserve-3d; }
  .ring.snap { transition: transform .55s cubic-bezier(.2, .8, .2, 1); }
  .ring-item { position: absolute; left: 50%; top: 46%; width: 210px; height: 158px; margin: -79px 0 0 -105px; border-radius: 12px; overflow: hidden; border: 2px solid rgba(255, 255, 255, .14); background: #0b1220; box-shadow: 0 18px 48px rgba(0, 0, 0, .55); transition: border-color .25s, box-shadow .25s; animation: itemin .5s var(--ease) both; }
  .ring-item::after { content: ""; position: absolute; inset: 0; background: linear-gradient(165deg, rgba(255, 255, 255, .12), transparent 34%); pointer-events: none; }
  .ring-item:hover { border-color: rgba(120, 180, 255, .85); box-shadow: 0 0 36px rgba(80, 150, 255, .55), 0 18px 48px rgba(0, 0, 0, .55); }
  .ring-item img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .ring-item .tag { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, rgba(5, 12, 26, .92)); color: #dbe7fb; font-size: 12px; padding: 20px 10px 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 1; }
  .ring-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .09); color: #fff; font-size: 22px; cursor: pointer; z-index: 5; backdrop-filter: blur(8px); transition: all .2s var(--ease); }
  .ring-nav:hover { background: rgba(255, 255, 255, .22); transform: translateY(-50%) scale(1.08); }
  .ring-nav.prev { left: 16px; } .ring-nav.next { right: 16px; }
  .ring-hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); color: #8fa3c4; font-size: 12.5px; background: rgba(10, 18, 38, .6); border: 1px solid rgba(140, 170, 220, .22); padding: 5px 15px; border-radius: 999px; pointer-events: none; transition: opacity .5s; backdrop-filter: blur(6px); }
  .ring-stage.empty .ring-nav, .ring-stage.empty .ring-hint { display: none; }

  .ring-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; text-align: center; padding: 24px; animation: rise .5s var(--ease) both; }
  .ring-empty .big { font-size: 46px; margin-bottom: 10px; animation: floaty 4s ease-in-out infinite; }
  .ring-empty h2 { font-size: 20px; font-weight: 800; color: #2f4a44; }
  .ring-empty p { font-size: 14px; color: #6f918a; margin-bottom: 18px; }

  /* ===== 灯箱 ===== */
  .lightbox { position: fixed; inset: 0; z-index: 300; background: rgba(6, 11, 24, .9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 22px; animation: lbin .28s var(--ease); }
  .lightbox img { max-width: 92vw; max-height: 68vh; border-radius: 14px; box-shadow: 0 32px 100px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .08); object-fit: contain; animation: imgin .4s var(--ease); }
  .lb-cap { margin-top: 16px; text-align: center; color: #e6eefc; max-width: 720px; width: 100%; max-height: 26vh; overflow-y: auto; overscroll-behavior: contain; background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .03)); border: 1px solid rgba(255, 255, 255, .13); border-radius: 16px; padding: 15px 20px 17px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 16px 48px rgba(0, 0, 0, .35); }
  .lb-cap b { font-size: 16.5px; display: block; letter-spacing: -.01em; }
  .lb-cap > span { font-size: 12.5px; color: #8fa3c4; display: block; margin-top: 3px; }
  .lb-cap p { font-size: 13.5px; color: #c3d2ea; margin-top: 8px; white-space: pre-wrap; text-align: left; }
  .lb-close { position: absolute; top: 18px; right: 22px; width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .1); color: #fff; font-size: 18px; cursor: pointer; backdrop-filter: blur(8px); transition: all .2s var(--ease); }
  .lb-close:hover { background: rgba(255, 255, 255, .22); transform: rotate(90deg); }
  .lb-prev, .lb-next { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .1); color: #fff; font-size: 24px; cursor: pointer; line-height: 1; backdrop-filter: blur(8px); transition: all .2s var(--ease); }
  .lb-prev { left: 18px; } .lb-next { right: 18px; }
  .lb-prev:hover, .lb-next:hover { background: rgba(255, 255, 255, .22); transform: translateY(-50%) scale(1.08); }
  .lb-count { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); color: #a9bcd9; font-family: var(--mono); font-size: 12.5px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .14); border-radius: 999px; padding: 4px 13px; backdrop-filter: blur(8px); }

  .lb-mono { margin-top: 14px; text-align: left; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .14); border-radius: 12px; padding: 13px 15px; }
  .lb-mono label { display: block; font-size: 12.5px; color: #8fa3c4; margin-bottom: 8px; }
  .lb-mono textarea { width: 100%; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16); color: #e6eefc; border-radius: 8px; padding: 9px 12px; font-size: 13.5px; font-family: var(--sans); min-height: 64px; resize: vertical; }
  .lb-mono textarea:focus { outline: none; border-color: #4d9fff; }
  .lb-btn { background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .22); color: #fff; border-radius: 8px; padding: 6px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: var(--sans); transition: all .2s var(--ease); }
  .lb-btn:hover { background: rgba(255, 255, 255, .24); transform: translateY(-1px); }
  .lb-btn:active { transform: scale(.96); }
  .lb-btn.primary { background: linear-gradient(135deg, #3b7bff, #1e56e8); border-color: transparent; box-shadow: 0 4px 14px rgba(37, 99, 235, .4); }
  .lb-btn.primary:hover { background: linear-gradient(135deg, #4d8bff, #2f6bff); }
  .lb-cmts { margin-top: 14px; text-align: left; }
  .cmt-head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #8fa3c4; margin-bottom: 8px; }
  .cmt { background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .12); border-radius: 10px; padding: 9px 13px; margin-bottom: 8px; }
  .cmt-del { float: right; border: none; background: transparent; color: #8fa3c4; cursor: pointer; font-size: 12px; padding: 1px 7px; border-radius: 4px; }
  .cmt-del:hover { color: #ff9c9c; background: rgba(255, 80, 80, .15); }
  .cmt b { font-size: 13px; color: #e6eefc; }
  .cmt .cmt-d { font-size: 11.5px; color: #7f93b5; margin-left: 8px; }
  .cmt p { font-size: 13px; color: #c3d2ea; margin-top: 3px; }
  .lb-cmts .empty { font-size: 12.5px; color: #7f93b5; }

  /* ===== 弹窗 ===== */
  .modal { position: fixed; inset: 0; z-index: 400; background: rgba(4, 8, 18, .62); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadein .22s var(--ease); }
  .modal-card { position: relative; width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; overscroll-behavior: contain; background: #0e1a33; border: 1px solid var(--line); border-radius: 18px; padding: 26px; box-shadow: 0 40px 100px rgba(0, 0, 0, .6); animation: popin .3s var(--ease); }
  .modal-card h3 { font-size: 17px; font-weight: 800; margin-bottom: 12px; }
  .m-close { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 14px; cursor: pointer; transition: all .2s; }
  .m-close:hover { color: var(--text); background: rgba(94, 160, 255, .12); }
  .modal-card input[type="text"], .modal-card input[type="email"], .modal-card input[type="password"], .modal-card textarea { width: 100%; margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; font-size: 14px; font-family: var(--sans); color: var(--text); background: rgba(7, 15, 29, .65); transition: border-color .2s, box-shadow .2s; }
  .modal-card input:focus, .modal-card textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(94, 160, 255, .18); }
  .modal-card textarea { min-height: 72px; resize: vertical; }

  .dropzone { margin-top: 4px; border: 1.5px dashed #33477a; border-radius: 14px; padding: 30px 18px; text-align: center; cursor: pointer; background: rgba(10, 20, 40, .45); transition: all .22s var(--ease); }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: rgba(94, 160, 255, .1); }
  .dropzone .dz-icon { font-size: 30px; animation: floaty 3.5s ease-in-out infinite; }
  .dropzone p { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
  .previews { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .pv { position: relative; width: 68px; height: 68px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); transition: transform .2s var(--ease); }
  .pv:hover { transform: scale(1.05); }
  .pv img { width: 100%; height: 100%; object-fit: cover; }
  .pv button { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(10, 18, 36, .78); color: #fff; font-size: 11px; cursor: pointer; display: grid; place-items: center; transition: background .2s; }
  .pv button:hover { background: #d05252; }
  .form-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
  .form-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--muted); }

  /* ===== Toast ===== */
  #toasts { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 500; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { background: rgba(13, 24, 48, .94); color: #fff; font-size: 13.5px; font-weight: 600; border-radius: 999px; padding: 11px 22px; border: 1px solid rgba(255, 255, 255, .14); box-shadow: 0 14px 44px rgba(0, 0, 0, .5); backdrop-filter: blur(10px); animation: toastin .3s var(--ease); }
  .toast.err { background: rgba(164, 44, 44, .95); border-color: rgba(255, 255, 255, .18); }

  @media (max-width: 680px) {
    .topbar { top: 8px; gap: 7px; padding: 7px 8px 7px 11px; }
    .brand-name { display: none; }
    .src-chip { padding: 6px 10px; }
    .src-chip .cnt { display: none; }
    .ring-stage { perspective: 640px; }
    .ring-item { width: 168px; height: 126px; margin: -63px 0 0 -84px; }
    .form-row { grid-template-columns: 1fr; }
    .lb-cap { max-height: 30vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="stars"></div>

<!-- ================= 顶栏 ================= -->
<header class="topbar">
  <div class="brand"><span class="brand-mark">R</span><span class="brand-name">recall</span></div>
  <div class="srcs">
    <button class="src-chip on" id="srcWall" type="button">线上回忆 <span class="cnt">…</span></button>
    <button class="src-chip" id="srcLocal" type="button">我的回忆 <span class="cnt">0</span></button>
  </div>
  <div class="bak-wrap">
    <button class="btn btn-icon" id="bakBtn" type="button" title="备份与迁移" aria-label="备份与迁移">⇅</button>
    <div class="menu" id="bakMenu" hidden>
      <button id="bakOut" type="button">📦 导出备份</button>
      <button id="bakIn" type="button">📥 导入备份</button>
    </div>
    <input type="file" id="importInput" accept="application/json,.json" hidden>
  </div>
  <div class="nav-auth" id="navAuth">
    <button class="btn" id="navLoginBtn" type="button">登录</button>
  </div>
  <div class="nav-auth" id="navUser" hidden>
    <span class="user-chip" id="navUserName"></span>
    <button class="btn" id="navLogout" type="button">退出</button>
  </div>
  <button class="btn btn-primary" id="upBtn" type="button">＋ 上传</button>
</header>

<!-- ================= 记忆环舞台 ================= -->
<main>
  <div class="ring-stage" id="ringStage">
    <div class="ring-floor"></div>
    <div class="ring" id="ring"></div>
    <div class="ring-empty" id="ringEmpty" hidden>
      <div class="big">💫</div>
      <h2>还没有回忆</h2>
      <p>上传第一张照片，让它围成你的记忆环。</p>
      <button class="btn btn-primary" id="ringEmptyBtn" type="button">📷 上传照片</button>
    </div>
    <button class="ring-nav prev" id="ringPrev" aria-label="上一个">‹</button>
    <button class="ring-nav next" id="ringNext" aria-label="下一个">›</button>
    <div class="ring-hint" id="ringHint">拖动旋转 · 点击照片</div>
  </div>
</main>

<!-- ================= 灯箱 ================= -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose" aria-label="关闭">✕</button>
  <span class="lb-count" id="lbCount"></span>
  <button class="lb-prev" id="lbPrev" aria-label="上一张">‹</button>
  <img id="lbImg" alt="回忆照片">
  <button class="lb-next" id="lbNext" aria-label="下一张">›</button>
  <div class="lb-cap">
    <b id="lbTitle"></b>
    <span id="lbMeta"></span>
    <p id="lbNote"></p>
    <div class="lb-mono" id="lbMono" hidden>
      <label>🕯️ 独白 · 仅发布者可编写</label>
      <textarea id="monoText" maxlength="300" placeholder="写下只属于这张照片的话…"></textarea>

/* ===================== 工具函数 ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2));

/* ===================== IndexedDB ===================== */
const DB_NAME = "recall-db", STORE = "memories";
function openDB() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open(DB_NAME, 1);
    rq.onupgradeneeded = e => e.target.result.createObjectStore(STORE, { keyPath: "id" });
    rq.onsuccess = e => res(e.target.result);
    rq.onerror = () => rej(rq.error);
  });
}
const dbOp = (mode, fn) => openDB().then(db => new Promise((res, rej) => {
  const tx = db.transaction(STORE, mode);
  const rq = fn(tx.objectStore(STORE));
  rq.onsuccess = () => res(rq.result);
  rq.onerror = () => rej(rq.error);
}));
const dbAll  = () => dbOp("readonly", s => s.getAll());
const dbPut  = rec => dbOp("readwrite", s => s.put(rec));
const dbDel  = id => dbOp("readwrite", s => s.delete(id));

/* ===================== 图片压缩 ===================== */
function compressImage(file, maxSide = 1920, quality = 0.85) {
  return new Promise(resolve => {
    if (!/^image\//.test(file.type) || file.type === "image/gif") return resolve(file);
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const ctx = cv.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      cv.toBlob(b => resolve(b || file), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

/* ===================== 全局状态 ===================== */
let ringSrc = localStorage.getItem("recall-src") === "local" ? "local" : "wall";
let wallRows = null, wallErr = false;
const anyUIOpen = () => !$("#lightbox").hidden || !$("#uploadModal").hidden || !$("#authModal").hidden || !$("#publishModal").hidden;

function closeUpload() { $("#uploadModal").hidden = true; }

/* ===================== 灯箱 ===================== */
let lbItems = [], lbIdx = 0;
const isAdmin = () => !!(sbUser && CONFIG.adminEmail && sbUser.email === CONFIG.adminEmail);
function openLightbox(items, idx) {
  lbItems = items; lbIdx = idx;

  renderLb();
}
function renderLb() {
  const it = lbItems[lbIdx];
  $("#lbImg").src = it.src;
  $("#lbTitle").textContent = it.title || "未命名回忆";
  $("#lbMeta").textContent = [it.author, it.date].filter(Boolean).join(" · ") || "";
  $("#lbCount").textContent = lbItems.length > 1 ? `${lbIdx + 1} / ${lbItems.length}` : "";
  const isLocal = it.kind === "local";
  const isOwner = it.kind === "wall" && sbUser && it.owner === sbUser.id;
  const canEditMono = isLocal || isOwner;
  $("#lbMono").hidden = !canEditMono;
  $("#lbCmts").hidden = isLocal || (it.kind === "wall" && it.pub === false && !isOwner);
  $("#lbLocalActs").hidden = !isLocal;
  const noteText = isLocal ? (it.note || "") : (it.wm || "（这段回忆还没有独白）");
  $("#lbNote").textContent = noteText;
  $("#lbNote").hidden = !noteText;
  if (!isLocal) {
    renderCmts(it);
    if (it.id) fetchWallCmts(it);
  }
  $("#monoText").value = canEditMono ? (it.wm || it.mono || "") : "";
  $("#monoPub").checked = it.pub !== false;
  $("#lbDel").hidden = !(it.kind === "wall" && (isAdmin() || (sbUser && it.owner === sbUser.id)));
}
function renderCmts(it) {
  const list = it.comments;
  $("#cmtList").innerHTML = list && list.length
    ? list.map(c => `<div class="cmt">${isAdmin() && c.id ? `<button class="cmt-del" data-cid="${c.id}" title="删除留言">✕</button>` : ""}<b>${esc(c.a)}</b><span class="cmt-d">${esc(c.d)}</span><p>${esc(c.t)}</p></div>`).join("")
    : `<div class="empty">还没有留言，来做第一个留言的人吧。</div>`;
}
async function fetchWallCmts(it) {
  if (it.cmtsFetched) return;
  it.cmtsFetched = true;
  try {
    const { data } = await sb.from("comments").select("*").eq("wall_id", it.id).order("created_at");
    it.comments = (data || []).map(c => ({ a: c.author, t: c.text, d: fmtDate(c.created_at), id: c.id }));
  } catch {}
  if (lbItems[lbIdx] === it) renderCmts(it);
}
$("#monoSave").onclick = async () => {

    await it.saveMono(v); it.mono = v; toast("独白已保存 ✓");
  } else if (it.kind === "wall" && sbUser && it.owner === sbUser.id) {
    const pub = $("#monoPub").checked;
    let up = await sb.from("wall_monos").upsert({ wall_id: it.id, mono: v });
    if (up.error && /wall_monos|relationship/i.test(up.error.message))
      up = await sb.from("wall").update({ mono: v }).eq("id", it.id);
    if (up.error) return toast("保存失败，请稍后再试", true);
    if (pub !== (it.pub !== false)) {
      const wp = await sb.from("wall").update({ mono_public: pub }).eq("id", it.id);
      if (wp.error) return toast("公开状态保存失败，请稍后再试", true);

};
$("#lbDel").onclick = async () => {

$("#lbLocalDel").onclick = async () => {

$("#cmtList").addEventListener("click", async e => {

$("#cmtSend").onclick = async () => {

function closeLightbox() { $("#lightbox").hidden = true; document.body.style.overflow = ""; }
const lbStep = d => { lbIdx = (lbIdx + d + lbItems.length) % lbItems.length; renderLb(); };
$("#lbClose").onclick = closeLightbox;
$("#lbPrev").onclick = () => lbStep(-1);
$("#lbNext").onclick = () => lbStep(1);
$("#lightbox").addEventListener("click", e => { if (e.target === e.currentTarget) closeLightbox(); });

/* ===================== 上传（本地回忆） ===================== */
let pendingFiles = [];
let previewUrls = [], recordUrls = [], ringUrls = [];
const makeURL = (blob, pool) => { const u = URL.createObjectURL(blob); pool.push(u); return u; };

const dz = $("#dropzone"), fi = $("#fileInput");
dz.addEventListener("click", () => fi.click());
dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("drag"); });
dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("drag"); addFiles(e.dataTransfer.files); });
fi.addEventListener("change", () => { addFiles(fi.files); fi.value = ""; });
function addFiles(list) {
  [...list].filter(f => /^image\//.test(f.type)).forEach(f => pendingFiles.push(f));
  renderPreviews();
}
function renderPreviews() {
  previewUrls.forEach(u => URL.revokeObjectURL(u)); previewUrls = [];
  $("#previews").innerHTML = pendingFiles.map((f, i) =>
    `<div class="pv"><img src="${makeURL(f, previewUrls)}" alt=""><button type="button" data-rm="${i}" aria-label="移除">✕</button></div>`
  ).join("");
  $("#previews").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
    pendingFiles.splice(+b.dataset.rm, 1);
    renderPreviews();
  });
}
$("#addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const title = $("#fTitle").value.trim();
  if (!title) return toast("请填写标题", true);
  if (!pendingFiles.length) return toast("请至少选择一张照片", true);
  const author = $("#fAuthor").value.trim();
  localStorage.setItem("recall-author", author);
  const photos = [];
  for (const f of pendingFiles) {
    const b = await compressImage(f);
    photos.push({ name: f.name, type: b.type || f.type, blob: b });
  }
  await dbPut({ id: uid(), title, author, note: $("#fNote").value.trim(), date: new Date().toISOString(), photos });
  pendingFiles = [];
  $("#addForm").reset();
  $("#fAuthor").value = author;
  renderPreviews();
  closeUpload();
  setSrc("local");
  renderLocal();
  toast("已保存到我的回忆 ✓");
});

async function renderLocal() {
  if (navigator.storage?.estimate) navigator.storage.estimate().then(({ usage }) => {
    if (usage) $("#storageHint").textContent = `本机回忆占用约 ${(usage / 1048576).toFixed(1)} MB`;
  });
}

/* ===================== 发布上墙（直传云端） ===================== */
let pubBusy = false;
async function openPublish(rec) {
  if (!sb || !sbUser) { toast("请先登录，再发布上墙", true); $("#navLoginBtn").click(); return; }
  if (pubBusy) return;
  pubBusy = true;
  $("#pubDesc").textContent = `正在把「${rec.title || "未命名回忆"}」的 ${rec.photos.length} 张照片上传到公开回忆墙…`;
  $("#pubProg").textContent = "";
  $("#publishModal").hidden = false;
  try {
    for (let i = 0; i < rec.photos.length; i++) {
      const p = rec.photos[i];
      const ext = ((p.name || "img.jpg").match(/\.(\w+)$/) || [, "jpg"])[1].toLowerCase();
      const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      $("#pubProg").textContent = `上传中 ${i + 1} / ${rec.photos.length} …`;
      const up = await sb.storage.from("photos").upload(path, p.blob, { contentType: p.type || "image/jpeg" });
      if (up.error) throw up.error;
      const ins = await sb.from("wall").insert({
        title: rec.title || "未命名回忆", author: rec.author || "", note: rec.note || "",
        date: rec.date || new Date().toISOString(), mono: p.mono || "",
        storage_path: path, owner: sbUser.id
      });
      if (ins.error) throw ins.error;
    }
    $("#pubProg").textContent = `✓ 全部 ${rec.photos.length} 张照片已上墙`;
    toast("发布成功，已上墙 ✓");
    setSrc("wall");
    loadWall(true);
  } catch (err) {
    $("#pubProg").textContent = "上传失败：" + (err.message || "请稍后再试");
    toast("发布失败，请稍后再试", true);
  } finally { pubBusy = false; }
}
const closePublish = () => { $("#publishModal").hidden = true; };
$("#pubClose").onclick = closePublish;
$("#publishModal").addEventListener("click", e => { if (e.target === e.currentTarget) closePublish(); });

/* ===================== 记忆环 ===================== */
let ringItems = [];
let ringRot = 0, ringDrag = false, ringLastX = 0, ringMoved = 0, ringAuto = true;
let emptyAction = () => openUpload();

async function renderRing() {
  const recs = (await dbAll()).sort((a, b) => b.date.localeCompare(a.date));
  ringUrls.forEach(u => URL.revokeObjectURL(u)); ringUrls = [];
  const localItems = recs.flatMap(r => r.photos.map(p => ({
    src: makeURL(p.blob, ringUrls),
    title: r.title, author: r.author, date: fmtDate(r.date), note: r.note, mono: p.mono || "",
    kind: "local", rec: r,
    saveMono: async t => { p.mono = t; await dbPut(r); }
  })));
  $("#srcLocal .cnt").textContent = localItems.length;
  if (ringSrc === "wall") ringItems = (wallRows || []).map(x => ({
    src: wallUrl(x.storage_path), title: x.title || "未命名回忆", author: x.author, date: fmtDate(x.date),
    kind: "wall", id: x.id, owner: x.owner,
    wm: (x.wall_monos && x.wall_monos[0] && x.wall_monos[0].mono) || x.mono || "",
    pub: x.mono_public !== false, path: x.storage_path
  }));
  else ringItems = localItems;
  const loading = ringSrc === "wall" && wallRows === null;
  const empty = !ringItems.length;
  $("#ringStage").classList.toggle("empty", empty || loading);
  $("#ringEmpty").hidden = !(empty && !loading);
  $("#ring").style.display = empty ? "none" : "";
  if (empty) {
    $("#ring").innerHTML = "";
    if (!loading) {
      const retry = ringSrc === "wall" && wallErr;
      $("#ringEmptyBtn").textContent = retry ? "↻ 重试" : "📷 上传照片";
      emptyAction = retry ? () => loadWall(true) : () => openUpload();
    }
    return;
  }
  const N = ringItems.length, slot = 360 / N;
  const halfW = window.innerWidth < 640 ? 84 : 105;
  const R = N > 2 ? Math.max(340, halfW / Math.tan(Math.PI / N) + 60) : 340;
  $("#ring").innerHTML = ringItems.map((it, i) =>
    `<div class="ring-item" data-i="${i}" style="transform: rotateY(${i * slot}deg) translateZ(${R}px)"><img src="${it.src}" alt=""><span class="tag">${esc(it.title)}${(it.mono || it.wm) ? " 🕯️" : ""}</span></div>`
  ).join("");
  ringRot = 0; applyRing();
  $("#ring").querySelectorAll(".ring-item").forEach(el => el.addEventListener("click", () => {
    if (ringMoved < 6) openLightbox(ringItems, +el.dataset.i);
  }));
}
function applyRing() { $("#ring").style.transform = `rotateY(${ringRot}deg)`; }
function snapRing() {
  const slot = 360 / Math.max(1, ringItems.length);
  ringRot = Math.round(ringRot / slot) * slot;
  const el = $("#ring");
  el.classList.add("snap");
  applyRing();
  setTimeout(() => el.classList.remove("snap"), 600);
}
const ringStage = $("#ringStage");
ringStage.addEventListener("pointerdown", e => {
  ringDrag = true; ringAuto = false; ringLastX = e.clientX; ringMoved = 0;
  $("#ring").classList.remove("snap");
  $("#ringHint").style.opacity = "0";
});
window.addEventListener("pointermove", e => {
  if (!ringDrag) return;
  const dx = e.clientX - ringLastX;
  ringLastX = e.clientX; ringMoved += Math.abs(dx);
  ringRot += dx * 0.25;
  applyRing();
});
window.addEventListener("pointerup", () => {
  if (!ringDrag) return;
  ringDrag = false;
  if (ringMoved >= 6) snapRing();   // 轻点不吸附，避免照片移位导致 click 落空
});
$("#ringPrev").onclick = () => { ringAuto = false; ringRot += 360 / Math.max(1, ringItems.length); snapRing(); };
$("#ringNext").onclick = () => { ringAuto = false; ringRot -= 360 / Math.max(1, ringItems.length); snapRing(); };
function tick() {
  if (ringAuto && ringItems.length > 2 && !anyUIOpen()) {
    ringRot += 0.04;
    applyRing();
  }
  requestAnimationFrame(tick);
}

/* ===================== 线上回忆墙（云端直读） ===================== */
const wallUrl = path => `${CONFIG.supabaseUrl}/storage/v1/object/public/photos/${encodeURIComponent(path)}`;

async function loadWall(force) {
  if (!sb) { wallRows = []; wallErr = true; updateCounts(); if (ringSrc === "wall") renderRing(); return; }
  try {
    let { data, error } = await sb.from("wall").select("*, wall_monos(mono)").order("created_at", { ascending: false });
    if (error && /wall_monos|relationship/i.test(error.message)) ({ data, error } = await sb.from("wall").select("*").order("created_at", { ascending: false }));
    if (error) throw error;
    wallRows = data || [];
    wallErr = false;
  } catch {
    wallRows = []; wallErr = true;
    toast("回忆墙加载失败，请稍后重试", true);
  }
  updateCounts();
  if (ringSrc === "wall") renderRing();
}
function updateCounts() {
  $("#srcWall .cnt").textContent = wallErr ? "!" : (wallRows == null ? "…" : wallRows.length);
}

/* ===================== 账号（Supabase 邮箱登录） ===================== */
let sb = null, sbUser = null, authMode = "login";
const sbReady = !!(CONFIG.supabaseUrl && CONFIG.supabaseKey && window.supabase);
if (sbReady) sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
else { $("#navAuth").hidden = true; $("#navUser").hidden = true; }

function applyUser(u) {
  sbUser = u;
  const name = u ? (u.user_metadata?.name || u.email?.split("@")[0] || "我") : "";
  $("#navAuth").hidden = !!u || !sbReady;
  $("#navUser").hidden = !u;
  if (u) {
    $("#navUserName").textContent = name;
    $("#navUserName").title = u.email || "";
    localStorage.setItem("recall-author", name);
    $("#fAuthor").value = name;
  }
}
if (sb) {
  sb.auth.getUser().then(({ data: { user } }) => applyUser(user)).catch(() => {});
  sb.auth.onAuthStateChange((_e, s) => applyUser(s?.user || null));
}
function syncAuthModal() {
  const reg = authMode === "register";
  $("#authTitle").textContent = reg ? "注册账号" : "登录";
  $("#authName").hidden = !reg;
  $("#authSubmit").textContent = reg ? "注册" : "登录";
  $("#authSwitch").textContent = reg ? "已有账号？去登录" : "没有账号？注册一个";
}
$("#navLoginBtn").onclick = () => { authMode = "login"; syncAuthModal(); $("#authModal").hidden = false; $("#authEmail").focus(); };
$("#authSwitch").onclick = () => { authMode = authMode === "login" ? "register" : "login"; syncAuthModal(); };
$("#authClose").onclick = () => { $("#authModal").hidden = true; };
$("#authModal").addEventListener("click", e => { if (e.target === e.currentTarget) $("#authModal").hidden = true; });
$("#authSubmit").onclick = async () => {
  const email = $("#authEmail").value.trim();
  const pass = $("#authPass").value;
  if (!/^\S+@\S+\.\S+$/.test(email)) return toast("请填写正确的邮箱", true);
  if (pass.length < 6) return toast("密码至少 6 位", true);
  $("#authSubmit").disabled = true;
  try {
    if (authMode === "register") {
      const name = $("#authName").value.trim() || email.split("@")[0];
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { name } } });
      if (error) throw error;
      if (data.session) { toast("注册成功，已登录 ✓"); $("#authModal").hidden = true; applyUser(data.user); }
      else toast("注册成功！请到邮箱点击确认链接后再登录");
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      toast("登录成功 ✓");
      $("#authModal").hidden = true;
      applyUser(data.user);
    }
  } catch (err) {
    toast(err.message === "Invalid login credentials" ? "邮箱或密码不正确" : (err.message || "操作失败，请稍后再试"), true);
  } finally { $("#authSubmit").disabled = false; }
};
$("#navLogout").onclick = async () => { if (sb) await sb.auth.signOut(); applyUser(null); toast("已退出账号"); };

/* ===================== 备份与恢复 ===================== */
const blobToB64 = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
$("#bakOut").onclick = async () => {
  $("#bakMenu").hidden = true;
  const recs = await dbAll();
  if (!recs.length) return toast("还没有可导出的回忆", true);
  toast("正在打包备份…");
  const memories = [];
  for (const r of recs) memories.push({ title: r.title, author: r.author, note: r.note, date: r.date, photos: await Promise.all(r.photos.map(async p => ({ name: p.name, type: p.type, mono: p.mono || "", blob: await blobToB64(p.blob) }))) });
  const data = { app: "recall", version: 1, exportedAt: new Date().toISOString(), identity: sbUser ? { email: sbUser.email, name: sbUser.user_metadata?.name || "" } : null, memories };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
  a.download = `recall-backup-${fmtDate(new Date().toISOString())}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`已导出 ${recs.length} 条回忆（含独白）✓`);
};
$("#bakIn").onclick = () => { $("#bakMenu").hidden = true; $("#importInput").click(); };
$("#importInput").addEventListener("change", async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); if (data.app !== "recall" || !Array.isArray(data.memories)) throw 0; }
  catch { return toast("备份文件无效", true); }
  if (!confirm(`备份包含 ${data.memories.length} 条回忆（${fmtDate(data.exportedAt)} 导出）。\n导入后会追加到本设备，不会覆盖现有数据。`)) return;
  toast("正在导入…");
  for (const r of data.memories) {
    const photos = [];
    for (const p of (r.photos || [])) {
      try { const res = await fetch(p.blob); photos.push({ name: p.name, type: p.type, mono: p.mono || "", blob: await res.blob() }); } catch {}
    }
    if (photos.length) await dbPut({ id: uid(), title: r.title || "导入的回忆", author: r.author || "", note: r.note || "", date: r.date || new Date().toISOString(), photos });
  }
  if (data.identity?.name) { localStorage.setItem("recall-author", data.identity.name); $("#fAuthor").value = data.identity.name; }
  renderLocal();
  setSrc("local");
  toast("导入完成 ✓（账号请在新设备用邮箱登录）");
});

/* ===================== 顶栏交互与初始化 ===================== */
$("#bakBtn").onclick = e => { e.stopPropagation(); $("#bakMenu").hidden = !$("#bakMenu").hidden; };
document.addEventListener("click", e => {
  if (!$("#bakMenu").hidden && !e.target.closest(".bak-wrap")) $("#bakMenu").hidden = true;
});
$("#upBtn").onclick = openUpload;
$("#upClose").onclick = closeUpload;
$("#uploadModal").addEventListener("click", e => { if (e.target === e.currentTarget) closeUpload(); });
$("#ringEmptyBtn").onclick = () => emptyAction();
function setSrc(s) {
  ringSrc = s;
  localStorage.setItem("recall-src", s);
  $("#srcWall").classList.toggle("on", s === "wall");
  $("#srcLocal").classList.toggle("on", s === "local");
  renderRing();
}
$("#srcWall").onclick = () => setSrc("wall");
$("#srcLocal").onclick = () => setSrc("local");

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (!$("#lightbox").hidden) closeLightbox();
    else if (!$("#uploadModal").hidden) closeUpload();
    else if (!$("#publishModal").hidden) closePublish();
    else if (!$("#authModal").hidden) $("#authModal").hidden = true;
    $("#bakMenu").hidden = true;
  }
  if (!$("#lightbox").hidden) {
    if (e.key === "ArrowLeft") lbStep(-1);
    if (e.key === "ArrowRight") lbStep(1);
  }
});

document.title = CONFIG.siteName + " · 记忆环";
$("#fAuthor").value = localStorage.getItem("recall-author") || "";
setSrc(ringSrc);
requestAnimationFrame(tick);
renderLocal();
loadWall(false);
</script>
</body>
</html>
